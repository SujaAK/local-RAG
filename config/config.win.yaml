# Windows, ~7 GB RAM, CPU only, llama.cpp backend. UNMEASURED starting points: test and adjust on dev.
# Use:  $env:RAG_CONFIG="config\config.win.yaml"
extends: config.yaml
backend: llamacpp
model: qwen2.5-1.5b-instruct          # label only; llama-server serves the one model it was started with
llamacpp:
  url: http://127.0.0.1:8080
  timeout: 900
  model_path: ""                      # optional: full path to the .gguf so the run manifest can hash it
num_ctx: 4096                         # keep equal to the -c value you start llama-server with
generation: {num_predict: 300}
pack: {context_token_budget: 2600}
retrieval: {dense_k: 15, sparse_k: 15, rerank_pool: 12, final_k: 6}
verify: {premise_sentences: 3, premise_max_words: 200, premise_mode: max_sentence, premise_pool: 6}
claims_prompt: system_claims_v2.txt